<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SIKAD — Find your next move</title>
  <meta name="description" content="SIKAD helps students see what they can realistically get done with the time they actually have, and replans when life changes.">
  <meta name="theme-color" content="#294B3A">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><path d='M6 41c10 0 11-9 17-13s10-3 12-7' fill='none' stroke='%23294B3A' stroke-width='4' stroke-linecap='round'/><circle cx='38.5' cy='13.5' r='6.5' fill='%23EBCB70' stroke='%23294B3A' stroke-width='3'/></svg>">
  <script>
    // Apply a saved light/dark choice before first paint (no flash). Falls back to the OS setting.
    try { var t = localStorage.getItem('sikad-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/sikad.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SIKAD">
  <link rel="preload" href="fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="spotlight" data-action="spotlightOff" aria-hidden="true"></div>
  <div id="sheet-root"></div>
  <div id="toast-root"></div>
  <noscript><p style="padding:16px">SIKAD needs JavaScript to run.</p></noscript>

  <script src="js/time.js"></script>
  <script src="js/data.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        try { navigator.serviceWorker.register('./sw.js').catch(function () {}); } catch (e) {}
      });
    }
  </script>
</body>
</html>
